---
services:
  oxia:
    image: oxia/oxia:main
    hostname: oxia
    container_name: oxia
    ports:
      - 6648:6648
    entrypoint: ["/oxia/bin/oxia"]
    command: ["standalone", "--data-dir=/data", "--shards=8"]
    volumes:
      - oxia-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/metrics || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    # Pin LocalStack to a stable release so CI is not affected by `latest` nightly/account-gating changes.
    image: ${LOCALSTACK_IMAGE:-localstack/localstack:3.6.0}
    hostname: localstack
    container_name: localstack
    ports:
      - 4566:4566
      - 4510-4559:4510-4559
    environment:
      SERVICES: s3
      DEBUG: 0
      PERSISTENCE: 1
      # LocalStack latest may require explicit acknowledgement to continue in community mode.
      LOCALSTACK_ACKNOWLEDGE_ACCOUNT_REQUIREMENT: "1"
    volumes:
      - localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack-init:
    image: amazon/aws-cli:latest
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      aws --endpoint-url=http://localstack:4566 s3 mb s3://kafka-ursa --region us-east-1 || true;
      exit 0;
      "

  compactor:
    image: ${COMPACTOR_IMAGE:-ursa-compact:standalone-s3-e2e}
    hostname: compactor
    container_name: compactor
    depends_on:
      oxia:
        condition: service_healthy
      localstack-init:
        condition: service_completed_successfully
    environment:
      OTEL_SDK_DISABLED: "true"
      URSA_JAVA_OPTS: "-Xmx1024M -XX:+UseZGC"

      # Catalog, WAL indexes, and log discovery
      URSA_METADATA_STORE_URL: oxia://oxia:6648/default
      URSA_OXIA_STORAGE_URL: oxia://oxia:6648/default
      URSA_ENTRY_SERDE_TYPE: KAFKA_BATCHED_RAW_PARQUET
      URSA_METASTORE_RATE_LIMIT: "500"
      URSA_REFRESH_LOG_INTERVAL_SECONDS: "5"
      URSA_INTERNAL_COMPACTION_TASK_PUBLISHER_ENABLED: "true"

      # WAL backend (S3 via LocalStack)
      URSA_BACKEND_STORAGE_TYPE: S3
      URSA_BUCKET: kafka-ursa
      # NOTE: must match Kafka brokers' `ursa.storage.path` (S3 key prefix) to avoid NoSuchKey(404).
      URSA_PREFIX: "${URSA_STORAGE_PATH:-ursa}"
      URSA_CLOUD_STORAGE_ENDPOINT: http://localstack:4566
      URSA_REGION: us-east-1
      URSA_S3_ACCESS_KEY_ID: test
      URSA_S3_SECRET_ACCESS_KEY: test

      # Lakehouse (parquet) path resolution for v2 reader/writer
      URSA_COMPACTION_BACKEND_STORAGE_TYPE: S3
      URSA_COMPACTION_BUCKET: kafka-ursa
      URSA_COMPACTION_PREFIX: "${URSA_STORAGE_PATH:-ursa}"
      URSA_COMPACTION_BUCKET_REGION: us-east-1

      # Keep the compaction cycle fast for demo/dev
      URSA_COMPACTED_FILE_SIZE_LIMIT: "10240"
      URSA_TAIL_VISIBILITY_INTERVAL_SECONDS: "5"
      URSA_COMPACTED_THREAD_NUM: "2"
      URSA_PUBLISH_THREAD_NUM: "2"
      URSA_COMMIT_THREAD_NUM: "2"

      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    working_dir: /opt/ursa
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        set -eu
        conf=/tmp/ursa-storage.properties
        : > "$$conf"
        property() { printf '%s=%s\n' "$$1" "$$2" >> "$$conf"; }
        property metadataStoreUrl "$$URSA_METADATA_STORE_URL"
        property oxiaStorageUrl "$$URSA_OXIA_STORAGE_URL"
        property backendStorageType "$$URSA_BACKEND_STORAGE_TYPE"
        property bucket "$$URSA_BUCKET"
        property prefix "$$URSA_PREFIX"
        property cloudStorageEndpoint "$$URSA_CLOUD_STORAGE_ENDPOINT"
        property region "$$URSA_REGION"
        property s3AccessKeyId "$$URSA_S3_ACCESS_KEY_ID"
        property s3SecretAccessKey "$$URSA_S3_SECRET_ACCESS_KEY"
        property compactionBackendStorageType "$$URSA_COMPACTION_BACKEND_STORAGE_TYPE"
        property compactionBucket "$$URSA_COMPACTION_BUCKET"
        property compactionPrefix "$$URSA_COMPACTION_PREFIX"
        property compactionBucketRegion "$$URSA_COMPACTION_BUCKET_REGION"
        property entrySerDeType "$$URSA_ENTRY_SERDE_TYPE"
        property compactedFileSizeLimit "$$URSA_COMPACTED_FILE_SIZE_LIMIT"
        property tailCompactDataVisibilityIntervalInSeconds "$$URSA_TAIL_VISIBILITY_INTERVAL_SECONDS"
        property refreshLocalTopicInternalInSeconds "$$URSA_REFRESH_LOG_INTERVAL_SECONDS"
        property internalCompactionTaskPublisherEnabled "$$URSA_INTERNAL_COMPACTION_TASK_PUBLISHER_ENABLED"
        property compactedThreadNum "$$URSA_COMPACTED_THREAD_NUM"
        property publishThreadNum "$$URSA_PUBLISH_THREAD_NUM"
        property commitThreadNum "$$URSA_COMMIT_THREAD_NUM"
        property metastoreRequestRateLimitPerSecond "$$URSA_METASTORE_RATE_LIMIT"
        exec java $$URSA_JAVA_OPTS \
          -Dio.netty.tryReflectionSetAccessible=true -Djava.net.preferIPv4Stack=true \
          -cp '/opt/ursa/ursa-storage-compact.jar:/opt/ursa/lib/*' \
          io.lakestream.ursa.compact.CompactionMain --conf "$$conf"
    restart: unless-stopped

  kafka-1:
    image: ${IMAGE:-kafka-diskless:latest}
    hostname: kafka-1
    container_name: kafka-1
    ports:
      - 29092:9092
    depends_on:
      oxia:
        condition: service_healthy
      localstack-init:
        condition: service_completed_successfully
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-1:19092,PLAINTEXT_HOST://localhost:29092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"

      # Diskless / Ursa storage
      KAFKA_URSA_STORAGE_ENABLE: "true"
      KAFKA_URSA_STORAGE_OXIA_SERVICE_URL: "oxia:6648"
      KAFKA_URSA_STORAGE_BACKEND_TYPE: "S3"
      KAFKA_URSA_STORAGE_S3_ENDPOINT: "http://localstack:4566"
      KAFKA_URSA_STORAGE_S3_ACCESS_KEY: "test"
      KAFKA_URSA_STORAGE_S3_SECRET_KEY: "test"
      KAFKA_URSA_STORAGE_S3_BUCKET: "kafka-ursa"
      KAFKA_URSA_STORAGE_S3_REGION: "us-east-1"
      KAFKA_URSA_STORAGE_S3_PATH_STYLE_ACCESS: "true"
      # NOTE: `ursa.storage.path` is treated as S3 key prefix.
      # Kafka validates it as a non-empty string, so the docker demo must set a non-empty value.
      # Override by exporting `URSA_STORAGE_PATH` before running docker compose.
      KAFKA_URSA_STORAGE_PATH: "${URSA_STORAGE_PATH:-ursa}"
      # Flush small batches quickly so the compactor won't see NoSuchKey on recently-written entries.
      KAFKA_URSA_STORAGE_WRITE_BUFFER_FLUSH_SIZE: "4096"
      KAFKA_URSA_STORAGE_WRITE_BUFFER_FLUSH_INTERVAL_MS: "100"

      # NOTE: the `kafka-diskless` image uses `KAFKA_JVM_PERFORMANCE_OPTS` (not `KAFKA_OPTS`) for JVM system properties
      # that still need to be passed directly to the JVM, such as AWS SDK credentials used by parquet readers/writers.
      KAFKA_JVM_PERFORMANCE_OPTS: >-
        -Daws.accessKeyId=test
        -Daws.secretAccessKey=test
    volumes:
      - kafka-1-data:/var/lib/kafka/data

  kafka-2:
    image: ${IMAGE:-kafka-diskless:latest}
    hostname: kafka-2
    container_name: kafka-2
    ports:
      - 39092:9092
    depends_on:
      oxia:
        condition: service_healthy
      localstack-init:
        condition: service_completed_successfully
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-2:19092,PLAINTEXT_HOST://localhost:39092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"

      KAFKA_URSA_STORAGE_ENABLE: "true"
      KAFKA_URSA_STORAGE_OXIA_SERVICE_URL: "oxia:6648"
      KAFKA_URSA_STORAGE_BACKEND_TYPE: "S3"
      KAFKA_URSA_STORAGE_S3_ENDPOINT: "http://localstack:4566"
      KAFKA_URSA_STORAGE_S3_ACCESS_KEY: "test"
      KAFKA_URSA_STORAGE_S3_SECRET_KEY: "test"
      KAFKA_URSA_STORAGE_S3_BUCKET: "kafka-ursa"
      KAFKA_URSA_STORAGE_S3_REGION: "us-east-1"
      KAFKA_URSA_STORAGE_S3_PATH_STYLE_ACCESS: "true"
      KAFKA_URSA_STORAGE_PATH: "${URSA_STORAGE_PATH:-ursa}"
      KAFKA_URSA_STORAGE_WRITE_BUFFER_FLUSH_SIZE: "4096"
      KAFKA_URSA_STORAGE_WRITE_BUFFER_FLUSH_INTERVAL_MS: "100"

      KAFKA_JVM_PERFORMANCE_OPTS: >-
        -Daws.accessKeyId=test
        -Daws.secretAccessKey=test
    volumes:
      - kafka-2-data:/var/lib/kafka/data

  kafka-3:
    image: ${IMAGE:-kafka-diskless:latest}
    hostname: kafka-3
    container_name: kafka-3
    ports:
      - 49092:9092
    depends_on:
      oxia:
        condition: service_healthy
      localstack-init:
        condition: service_completed_successfully
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-3:19092,PLAINTEXT_HOST://localhost:49092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"

      KAFKA_URSA_STORAGE_ENABLE: "true"
      KAFKA_URSA_STORAGE_OXIA_SERVICE_URL: "oxia:6648"
      KAFKA_URSA_STORAGE_BACKEND_TYPE: "S3"
      KAFKA_URSA_STORAGE_S3_ENDPOINT: "http://localstack:4566"
      KAFKA_URSA_STORAGE_S3_ACCESS_KEY: "test"
      KAFKA_URSA_STORAGE_S3_SECRET_KEY: "test"
      KAFKA_URSA_STORAGE_S3_BUCKET: "kafka-ursa"
      KAFKA_URSA_STORAGE_S3_REGION: "us-east-1"
      KAFKA_URSA_STORAGE_S3_PATH_STYLE_ACCESS: "true"
      KAFKA_URSA_STORAGE_PATH: "${URSA_STORAGE_PATH:-ursa}"
      KAFKA_URSA_STORAGE_WRITE_BUFFER_FLUSH_SIZE: "4096"
      KAFKA_URSA_STORAGE_WRITE_BUFFER_FLUSH_INTERVAL_MS: "100"

      KAFKA_JVM_PERFORMANCE_OPTS: >-
        -Daws.accessKeyId=test
        -Daws.secretAccessKey=test
    volumes:
      - kafka-3-data:/var/lib/kafka/data

volumes:
  oxia-data:
  localstack-data:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
